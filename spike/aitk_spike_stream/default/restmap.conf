# Same shape the real runtime needs: AI Toolkit calls
# https://{host}:8089/{tenant}/slim-api/v1alpha1/<path> with its own bearer
# token, so splunkd must not try to authenticate it.
[script:aitk_spike_stream]
match = /aitkspike
script = spike_stream.py
scripttype = persist
handler = spike_stream.SpikeStream
python.version = python3
requireAuthentication = false
output_modes = json
passPayload = true
passHttpHeaders = true
passHttpCookies = false
