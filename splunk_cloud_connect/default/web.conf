# Splunk Web proxies only the custom endpoints an app exposes. The
# instance-role connections page calls /services/aitk_local/connections[/...];
# the endpoint itself checks that the caller is an admin.
[expose:aitk_local_connections]
pattern = aitk_local/connections
methods = GET

[expose:aitk_local_connections_kind]
pattern = aitk_local/connections/*
methods = POST

[expose:aitk_local_connections_action]
pattern = aitk_local/connections/*/*
methods = POST, DELETE
