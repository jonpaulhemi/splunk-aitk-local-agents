[runtime]
# Host name AI Toolkit uses to reach the local runtime. It must match the name
# on splunkd's TLS certificate. Empty means this machine's FQDN.
advertised_host =
# Management port. Empty means the port splunkd is serving on.
advertised_port =

[agent]
# Characters of each tool result (such as a Splunk search's rows) the model
# sees; longer results are cut, with a note telling the model so. Every result
# is resent on each step, so this keeps long investigations inside the model's
# context window. Empty means 16000 (about 4,000 tokens).
max_tool_result_chars =
