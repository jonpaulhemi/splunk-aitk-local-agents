# AI Toolkit asks Cloud Connect for its tenant and token at
# /servicesNS/nobody/splunk_cloud_connect/v1alpha1/cloud-connection/splunk_ml_toolkit
[script:aitk_local_cloud_connect]
match = /v1alpha1/cloud-connection
script = aitk_local_cloud_connect.py
scripttype = persist
handler = aitk_local_cloud_connect.CloudConnectStandIn
requireAuthentication = true
passSystemAuth = true
output_modes = json
python.version = python3
python.required = 3.13

# Admin-only self-check of the bundled agent libraries:
# GET /services/aitk_local/diagnostics
[script:aitk_local_diagnostics]
match = /aitk_local/diagnostics
script = aitk_local_diagnostics.py
scripttype = persist
handler = aitk_local_diagnostics.Diagnostics
requireAuthentication = true
output_modes = json
python.version = python3
python.required = 3.13

# The local agent runtime: AI Toolkit's AgentCore calls, at
# /services/aitk_local/slim-api/v1alpha1/... (see the stand-in's tenantName).
# AI Toolkit authenticates with the stand-in's bearer token, not a Splunk
# session, so splunkd passes the request through and the handler checks it.
[script:aitk_local_runtime]
match = /aitk_local/slim-api/v1alpha1
script = aitk_local_runtime.py
scripttype = persist
handler = aitk_local_runtime.Runtime
requireAuthentication = false
passHttpHeaders = true
passPayload = true
passSystemAuth = true
output_modes = json
python.version = python3
python.required = 3.13

# Admin-only: turn off AI Toolkit's cloud syncs and telemetry, and optionally
# set its MCP domain allowlist. POST /services/aitk_local/offline_setup
# [allowed_domains=host1,*.example.com]. Safe to re-run.
[script:aitk_local_offline_setup]
match = /aitk_local/offline_setup
script = aitk_local_offline_setup.py
scripttype = persist
handler = aitk_local_offline_setup.OfflineSetup
requireAuthentication = true
output_modes = json
python.version = python3
python.required = 3.13

# Admin-only: Cloud Connect's setup for instance-role connections (Bedrock
# models and knowledge bases with a role ARN and no access keys), written into
# AI Toolkit's own connection store. See docs/instance-role-connections.md.
#   GET    /services/aitk_local/connections
#   POST   /services/aitk_local/connections/{models|knowledge_bases}[/test|/available]
#   POST   /services/aitk_local/connections/{models|knowledge_bases}/<name>   (edit)
#   DELETE /services/aitk_local/connections/{models|knowledge_bases}/<name>
[script:aitk_local_connections]
match = /aitk_local/connections
script = aitk_local_connections.py
scripttype = persist
handler = aitk_local_connections.Connections
requireAuthentication = true
passPayload = true
output_modes = json
python.version = python3
python.required = 3.13
