# This app takes the id of Splunk's Cloud Connect app on purpose: AI Toolkit
# looks Cloud Connect up by this id. It cannot be installed alongside the real
# Cloud Connect app.

[launcher]
author = splunk-aitk-local-agents
description = Runs AI Toolkit agents on this search head instead of Splunk's cloud. Stands in for Cloud Connect.
version = 0.3.1

[package]
id = splunk_cloud_connect
check_for_updates = false

[install]
is_configured = true

[ui]
is_visible = false
label = AITK Local Agent Runtime
